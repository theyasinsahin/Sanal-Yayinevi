name: Docker checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare non-secret runtime metadata
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p artifacts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the same isolated test services used locally
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          files: compose.test.yaml
          targets: |
            checks
            browser
          load: true
          set: |
            checks.cache-from=type=gha,scope=betik-checks
            checks.cache-to=type=gha,mode=max,scope=betik-checks
            browser.cache-from=type=gha,scope=betik-browser
            browser.cache-to=type=gha,mode=max,scope=betik-browser
      - name: Lint and unit/integration tests
        run: docker compose -f compose.test.yaml run --rm --interactive=false checks
      - name: Build and browser tests
        run: docker compose -f compose.test.yaml run --rm --interactive=false browser
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
