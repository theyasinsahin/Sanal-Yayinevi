name: Manual Android build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Local API connection
        type: choice
        options: [emulator, usb]
        default: emulator
      accept_sdk_license:
        description: I have reviewed and accept the Android SDK license at developer.android.com/studio
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  android:
    if: ${{ inputs.accept_sdk_license }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare build metadata
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p artifacts/android
      - name: Build toolchain image
        run: docker compose -f compose.android.yaml --profile android build android
      - name: Install explicitly accepted SDK packages
        run: docker compose -f compose.android.yaml --profile android run --rm --interactive=false -e CI=true -e ANDROID_SDK_LICENSE_ACCEPTED=true android setup-ci
      - name: Build debug APK and unsigned AAB
        env:
          ANDROID_BUILD_TARGET: ${{ inputs.target }}
        run: docker compose -f compose.android.yaml --profile android run --rm --interactive=false android build "$ANDROID_BUILD_TARGET"
      - name: Android outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ inputs.target }}
          path: |
            artifacts/android/**/*.apk
            artifacts/android/**/*.aab
          if-no-files-found: error
          retention-days: 7
