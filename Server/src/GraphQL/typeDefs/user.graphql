# src/graphql/typeDefs/user.graphql

# ─── Mevcut tipler ───────────────────────────────────────────────

type AuthPayload {
  token: String!
  user: User!
}

# ─── Yeni Alt Tipler ─────────────────────────────────────────────

type PrivacySettings {
  isProfilePublic: Boolean!
  isLibraryPublic: Boolean!
  isFollowListPublic: Boolean!
  allowMessages: String!
  showInSearchEngines: Boolean!
}

type NotificationSettings {
  newFollower: Boolean!
  mentionInSession: Boolean!
  bookComment: Boolean!
  bookLike: Boolean!
  quoteLike: Boolean!
  sessionReply: Boolean!
  publishingOffer: Boolean!
  offerUpdate: Boolean!
  emailDigest: Boolean!
  emailOffers: Boolean!
  emailMarketing: Boolean!
}

type AuthorSettings {
  defaultLanguage: String!
  publishingVisible: Boolean!
  copyrightNote: String!
  weeklyWordGoal: Int
  preferredGenres: [String!]!
}

# ─── Input tipleri (Mutation argümanları için) ────────────────────

input PrivacySettingsInput {
  isProfilePublic: Boolean
  isLibraryPublic: Boolean
  isFollowListPublic: Boolean
  allowMessages: String
  showInSearchEngines: Boolean
}

input NotificationSettingsInput {
  newFollower: Boolean
  mentionInSession: Boolean
  bookComment: Boolean
  bookLike: Boolean
  quoteLike: Boolean
  sessionReply: Boolean
  publishingOffer: Boolean
  offerUpdate: Boolean
  emailDigest: Boolean
  emailOffers: Boolean
  emailMarketing: Boolean
}

input AuthorSettingsInput {
  defaultLanguage: String
  publishingVisible: Boolean
  copyrightNote: String
  weeklyWordGoal: Int
  preferredGenres: [String!]
}

# ─── User tipi (yeni alanlar eklendi) ────────────────────────────

type User {
  id: ID!
  username: String!
  fullName: String!
  bio: String!
  profilePicture: String!
  email: String!
  role: String!
  isVerified: Boolean!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  isPremium: Boolean!

  donations: [Transaction]

  savedBooks: [Book]
  draftBooks: [Book]
  favouriteAuthors: [User]
  usersBooks: [Book]
  followedBooks: [Book]
  followers: [User]
  following: [User]

  # Ayar alanları — yalnızca kendi profilinde dolu gelir
  privacySettings: PrivacySettings
  notificationSettings: NotificationSettings
  authorSettings: AuthorSettings
}

# ─── Mutation'lar ─────────────────────────────────────────────────

extend type Mutation {
  # Mevcut mutation'lar (değişmedi)
  googleAuth(token: String!): AuthPayload!
  forgotPassword(email: String!): Status!
  resetPassword(token: String!, newPassword: String!): Status!
  sendRegistrationCode(email: String!, username: String!): Status!
  register(
    username: String!
    fullName: String!
    email: String!
    password: String!
    code: String!
  ): Status!
  login(email: String!, password: String!): AuthPayload
  deleteUserById(id: ID!): Status!
  toggleFollowUser(followId: ID!): Status!
  updateProfile(
    username: String
    fullName: String
    bio: String
    profilePicture: String
  ): User!
  toggleSaveBook(bookId: ID!): User!

  # ── Yeni: Hesap ──────────────────────────────────────────────────
  changeEmail(newEmail: String!, currentPassword: String!): Status!
  changePassword(currentPassword: String!, newPassword: String!): Status!

  # ── Yeni: Ayarlar ────────────────────────────────────────────────
  updatePrivacySettings(privacySettings: PrivacySettingsInput!): User!
  updateNotificationSettings(
    notificationSettings: NotificationSettingsInput!
  ): User!
  updateAuthorSettings(authorSettings: AuthorSettingsInput!): User!

  # ── Yeni: Hesap Yönetimi ─────────────────────────────────────────
  deactivateAccount: Status!
  deleteAccount: Status!
}

# ─── Query'ler ────────────────────────────────────────────────────

extend type Query {
  getUserById(id: ID!): User
  getUserByUsername(username: String!): User
  getUserByEmail(email: String!): User
  getAllUsers: [User!]
  me: User
  getFollowingByUserId(id: ID!): [User]
  getFollowersByUserId(id: ID!): [User]
  getSavedBooksByUserId(id: ID!): [Book]
  getUsersBooksByUserId(id: ID!): [Book]
}
