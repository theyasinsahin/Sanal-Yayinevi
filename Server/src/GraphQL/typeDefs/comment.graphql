# src/graphql/typeDefs/comment.graphql

extend type Query {
  getCommentsByBookId(bookId: ID!): [Comment!]
  getCommentById(id: ID!): Comment
  getCommentsByUserId(userId: ID!): [Comment!]
  getAllComments: [Comment!]
}

extend type Mutation {
  createComment(bookId: ID!, content: String!): Comment!
  deleteComment(id: ID!): Status!
  toggleCommentLike(commentId: ID!): Comment
  replyToComment(bookId: ID!, content: String!, parentCommentId: ID!): Comment
}

type Comment {
  id: ID!
  userId: User!
  bookId: ID!
  content: String!
  date: DateTime!
  replies: [Comment]
  likedBy: [ID]
  parentId: ID
}
