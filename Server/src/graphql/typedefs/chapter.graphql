# src/graphql/typeDefs/chapter.graphql

extend type Query {
  getChaptersByBookId(bookId: ID!): [Chapter!]
  getChapterById(id: ID!): Chapter
  getAllChapters(limit: Int, offset: Int): [Chapter!]
  # Yazarın tüm bölümlerini çekmek nadir bir senaryodur ama kalabilir
  getChaptersByAuthorId(authorId: ID!): [Chapter!]
}

extend type Mutation {
  createChapter(
    bookId: ID!
    title: String!
    content: String!
    pageCount: Int
    isHidden: Boolean
  ): Chapter!

  updateChapter(
    chapterId: ID!
    title: String
    content: String
    pageCount: Int
    isHidden: Boolean
  ): Chapter!

  deleteChapter(id: ID!): Status!
}

enum ChapterAccessStatus { READABLE REGISTRATION_REQUIRED HIDDEN UNAVAILABLE }

type ChapterMusic {
  url: String!
  title: String!
  duration: Float!
  publicId: String!
}

type Chapter {
  music: ChapterMusic
  accessStatus: ChapterAccessStatus!
  id: ID!
  bookId: ID!
  authorId: ID!
  title: String!
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  pageCount: Int!
  isHidden: Boolean!
  canReadContent: Boolean!
  wordCount: Int
}
