<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon: modern tarayıcılar SVG'yi tercih eder, ICO eski
         tarayıcılar/Windows kısayolları için fallback -->
    <link rel="icon" href="%PUBLIC_URL%/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/images/betik.svg" type="image/svg+xml" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- PWA / adres çubuğu rengi — manifest.json'daki theme_color ile aynı -->
    <meta name="theme-color" content="#F7F3EC" />

    <meta
      name="description"
      content="Betik — kaleminizden çıkan eserlerin gerçek bir kitaba dönüşme yolculuğu. Kitap oku, yaz ve paylaş."
    />

    <!-- iOS: "Ana Ekrana Ekle" ile açıldığında tarayıcı çubuğu olmadan,
         bağımsız bir uygulama gibi çalışsın -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Betik" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />

    <!-- Android/Chrome: eski "mobile-web-app-capable" meta'sı, bazı
         Chromium sürümlerinde manifest'e ek olarak hâlâ kontrol edilir -->
    <meta name="mobile-web-app-capable" content="yes" />

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">

    <!--
      manifest.json, uygulama telefona/masaüstüne "yüklendiğinde"
      kullanılan meta verileri (isim, ikonlar, tema rengi vb.) sağlar.
      https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Betik</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

  </body>
</html>
