name: betik-dev

x-node-build: &node-build
  context: .
  dockerfile: docker/Dockerfile
  target: development
  args:
    LOCAL_UID: ${LOCAL_UID:-1000}
    LOCAL_GID: ${LOCAL_GID:-1000}
    BETIK_WORKSPACE_PATH: ${BETIK_WORKSPACE_PATH:?Run ./dev init from the Linux project directory}

x-node: &node
  build: *node-build
  image: betik-development
  init: true
  working_dir: ${BETIK_WORKSPACE_PATH}

x-server-env: &server-env
  NODE_ENV: development
  BETIK_DEV_PACKAGES: Server
  BETIK_DOCKER_DEV: "true"
  MONGO_URI: mongodb://mongo:27017/betik_dev?replicaSet=rs0
  JWT_SECRET: ${JWT_SECRET:?Run ./dev init}
  CLIENT_URL: http://localhost:3000
  API_URL: http://localhost:5000
  PORT: "5000"
  REGISTRATION_GATE_ENABLED: "true"
  PRINT_SYSTEM_ENABLED: "true"
  PRINT_PAYMENTS_MODE: SANDBOX
  PRINT_SANDBOX_WEBHOOK_SECRET: ${PRINT_SANDBOX_WEBHOOK_SECRET:?Run ./dev init}
  PRINT_ADDRESS_ENCRYPTION_KEY: ${PRINT_ADDRESS_ENCRYPTION_KEY:?Run ./dev init}
  CHAPTER_MUSIC_ENABLED: ${CHAPTER_MUSIC_ENABLED:-true}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  DEV_EXTERNAL_INTEGRATIONS: ${DEV_EXTERNAL_INTEGRATIONS:-false}
  DEV_MAIL_DIRECTORY: ${BETIK_WORKSPACE_PATH}/artifacts/development/mail
  EMAIL_USER: ${EMAIL_USER:-}
  EMAIL_PASS: ${EMAIL_PASS:-}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

services:
  mongo:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 3s
      timeout: 5s
      retries: 40

  mongo-init:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./docker/init-mongo.sh:/opt/betik/init-mongo.sh:ro
    entrypoint: ["bash", "/opt/betik/init-mongo.sh"]
    restart: "no"

  seed:
    <<: *node
    volumes:
      - ./Server:${BETIK_WORKSPACE_PATH}/Server:ro
      - server-modules:${BETIK_WORKSPACE_PATH}/Server/node_modules
      - npm-cache:/home/node/.npm
      - ./artifacts:${BETIK_WORKSPACE_PATH}/artifacts
    environment:
      <<: *server-env
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:?Run ./dev init}
    command: ["node", "Server/src/scripts/seedDevelopment.js"]
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: "no"

  server:
    <<: *node
    volumes:
      - ./Server:${BETIK_WORKSPACE_PATH}/Server:ro
      - server-modules:${BETIK_WORKSPACE_PATH}/Server/node_modules
      - npm-cache:/home/node/.npm
      - ./artifacts/development/mail:${BETIK_WORKSPACE_PATH}/artifacts/development/mail
    environment: *server-env
    command: ["npm", "--prefix", "Server", "run", "dev"]
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{ healthCheck }'})}).then(r=>r.json()).then(r=>{if(!r.data?.healthCheck)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  client:
    <<: *node
    volumes:
      - ./Client:${BETIK_WORKSPACE_PATH}/Client:ro
      - client-modules:${BETIK_WORKSPACE_PATH}/Client/node_modules
      - npm-cache:/home/node/.npm
    environment:
      BETIK_DEV_PACKAGES: Client
      HOST: 0.0.0.0
      PORT: "3000"
      BROWSER: none
      WDS_SOCKET_HOST: localhost
      WDS_SOCKET_PORT: "3000"
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WS_URL: ws://localhost:5000/graphql
      REACT_APP_GOOGLE_LOGIN_URI: http://localhost:5000/auth/google/callback
      REACT_APP_DOCKER_DEV: "true"
      REACT_APP_DEV_INTEGRATIONS: ${DEV_EXTERNAL_INTEGRATIONS:-false}
      REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      REACT_APP_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      REACT_APP_CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
    command: ["npm", "--prefix", "Client", "start"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

  workspace:
    <<: *node
    volumes:
      - ${BETIK_WORKSPACE_PATH}:${BETIK_WORKSPACE_PATH}
      - server-modules:${BETIK_WORKSPACE_PATH}/Server/node_modules
      - client-modules:${BETIK_WORKSPACE_PATH}/Client/node_modules
      - npm-cache:/home/node/.npm
    profiles: ["tools"]
    command: ["sleep", "infinity"]

volumes:
  mongo-data:
  server-modules:
  client-modules:
  npm-cache:
